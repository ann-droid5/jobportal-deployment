<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
</head>
<body>

    <h2>Student Registration</h2>

    <form action="/add-student" method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" required><br><br>

        <button type="submit">Submit</button>
    </form>
     <hr>

    <table border="1" id="studentTable">
        <tr>
            <th>NAME</th>
            <th>EMAIL</th>
            <th>AGE</th>
            <th>UPDATE</th>
            <th>DELETE</th>
        </tr>
    </table>

    <script>
        fetch("/students")
        .then(response => response.json())
        .then(data=> {
            const table = document.getElementById("studentTable");
            data.forEach(student=> {
                const row = table.insertRow();
                row.insertCell(0).innerText =  student.name;
                row.insertCell(1).innerText = student.email;
                row.insertCell(2).innerText = student.age;

                row.insertCell(3).innerHTML=
                    `<button onclick="editStudent('${student._id}','${student.name}','${student.email}','${student.age}')">Update</button>`
                row.insertCell(4).innerHTML=
                    `<button onclick="deleteStudent('${student._id}')">Delete</button>`
            });
        });

        function deleteStudent(id){
            fetch(`/delete-student/$(id)`,{
                method: "DELETE"
            })
            .then(res=> res.text())
            .then(msg =>{
                alert(msg);
                location.reload();
            });
        }
        //update function-prefill form
        function editStudent(id,name,email,age){
            document.querySelector("input[name='name']").value = name;
            document.querySelector("input[email='email']").value = email;
            document.querySelector("input[age='age']").value = age;

            const form = document.querySelector("form");
            form.action=`/update-student/$(id)`;
        }

    </script>

</html>
